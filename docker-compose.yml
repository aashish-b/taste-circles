services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taste
      POSTGRES_PASSWORD: taste
      POSTGRES_DB: taste_circles
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taste -d taste_circles"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - taste_circles_db:/var/lib/postgresql/data

volumes:
  taste_circles_db:
